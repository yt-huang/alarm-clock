name: build-and-deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /opt/alarm-clock
  APP_PORT: "8025"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package static artifact
        run: tar -czf dist.tgz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: alarm-clock-dist
          path: dist.tgz
          if-no-files-found: error
      - name: Set lowercase image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alarm-clock-dist
          path: artifact
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE: ${{ needs.build.outputs.image }}:latest
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          scp -i ~/.ssh/server_key artifact/dist.tgz "${SERVER_USER}@${SERVER_HOST}:/tmp/alarm-clock-dist.tgz"
          ssh -i ~/.ssh/server_key "${SERVER_USER}@${SERVER_HOST}" "APP_DIR='${APP_DIR}' APP_PORT='${APP_PORT}' IMAGE='${IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p "$APP_DIR"
          sudo chown "$USER:$USER" "$APP_DIR"
          cd "$APP_DIR"
          cat > docker-compose.yml <<COMPOSE
          services:
            alarm-clock:
              image: ${IMAGE}
              container_name: alarm-clock
              restart: unless-stopped
              ports:
                - "${APP_PORT}:80"
          COMPOSE
          for i in 1 2 3; do
            if sudo docker compose pull; then
              break
            fi
            echo "docker compose pull failed (attempt $i), retrying in 10s"
            sleep 10
          done
          sudo docker compose up -d || true
          if ! sudo docker ps --format '{{.Names}}' | grep -qx alarm-clock; then
            echo "alarm-clock container is not running after compose up" >&2
            exit 1
          fi
          sudo mkdir -p /tmp/alarm-clock-dist
          sudo rm -rf /tmp/alarm-clock-dist/*
          sudo tar -xzf /tmp/alarm-clock-dist.tgz -C /tmp/alarm-clock-dist
          sudo docker exec alarm-clock sh -c 'rm -rf /usr/share/nginx/html/*'
          sudo tar -C /tmp/alarm-clock-dist -cf - . | sudo docker exec -i alarm-clock tar -C /usr/share/nginx/html -xf -
          sudo docker restart alarm-clock >/dev/null
          sudo docker image prune -f
          sudo docker compose ps
          REMOTE
